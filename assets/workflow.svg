<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">小红书参考拆解与创作流程</title>
  <desc id="desc">输入参考和真实素材，拆解结构并核对事实，输出单篇草稿和逐图方案。这是流程示意，非运行截图。</desc>
  <rect width="1200" height="540" rx="24" fill="#f6f3eb"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="56" y="68" font-size="18" fill="#656458" letter-spacing="3">XHS VIRAL REPLICA · 工作流程</text>
    <text x="56" y="127" font-size="40" font-weight="700" fill="#222e29">从一篇参考，到你自己的图文草稿</text>
    <text x="56" y="167" font-size="20" fill="#656458">借鉴结构，用自己的事实与表达重新创作。</text>
    <rect x="56" y="208" width="330" height="240" rx="16" fill="#fffdf7" stroke="#d9d6ca"/>
    <rect x="435" y="208" width="330" height="240" rx="16" fill="#fffdf7" stroke="#d9d6ca"/>
    <rect x="814" y="208" width="330" height="240" rx="16" fill="#243f33"/>
    <g font-size="16" font-weight="700" fill="#8b4b30">
      <text x="82" y="244">01 / 提供材料</text><text x="461" y="244">02 / 拆解与创作</text>
    </g>
    <text x="840" y="244" font-size="16" font-weight="700" fill="#d9e6b9">03 / 审阅草稿</text>
    <g font-size="27" font-weight="700" fill="#222e29">
      <text x="82" y="294">参考 ＋ 真实素材</text><text x="461" y="294">结构 ＋ 事实核对</text>
    </g>
    <text x="840" y="294" font-size="27" font-weight="700" fill="#fffdf7">单篇图文创作方案</text>
    <g font-size="20" fill="#656458">
      <text x="82" y="341">参考链接 / 截图 / 原文</text><text x="82" y="378">自己的资料 / 照片 / 记录</text><text x="82" y="415">没有体验，就说明没有</text>
      <text x="461" y="341">识别可借鉴的内容顺序</text><text x="461" y="378">重写场景与具体细节</text><text x="461" y="415">标明来源与待补材料</text>
    </g>
    <g font-size="20" fill="#ebeedf">
      <text x="840" y="341">3个标题 ＋ 正文 ＋ 标签</text><text x="840" y="378">封面字 ＋ 逐图制作稿</text><text x="840" y="415">拆解依据 ＋ 素材缺口</text>
    </g>
    <g fill="none" stroke="#8b4b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M399 328h23m-8-8 8 8-8 8"/><path d="M778 328h23m-8-8 8 8-8 8"/>
    </g>
    <text x="56" y="496" font-size="17" fill="#656458">流程示意 · 非运行截图 · 默认交付草稿与逐图方案；成图需要图像工具，发布需另行授权。</text>
  </g>
</svg>
